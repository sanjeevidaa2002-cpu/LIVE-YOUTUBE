<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamLoop 24x7 - YouTube RTMP Live Stream Engine</title>
    <meta name="description" content="Multi-user 24x7 YouTube RTMP loop streaming platform with Google OAuth authentication, isolated user video libraries & playlists, and dedicated administrator panel for server, user, storage, and stream process management." />
    <meta property="og:title" content="StreamLoop 24x7 - YouTube RTMP Live Stream Engine" />
    <meta property="og:description" content="Multi-user 24x7 YouTube RTMP loop streaming platform with Google OAuth authentication, isolated user video libraries & playlists, and dedicated administrator panel for server, user, storage, and stream process management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully prevent unhandled promise rejection for benign WebSocket closure in sandboxed iframe previews
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && event.message) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
